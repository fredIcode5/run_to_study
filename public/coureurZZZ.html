<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coureur ZZZ - Animations et Personnage</title>
  <style>
    :root {
      /* Palette de couleurs par défaut du coureur */
      --couleur-chaussure: #f4f6fb;
      --couleur-chaussure-blanc: #ffffff;
      --couleur-chaussure-fonce: #ffffff;
      --couleur-bras: #2563eb;
      --couleur-jambes: #e84c9d;
      --couleur-mains: #2563eb;
      --couleur-torse: #000000;
      --couleur-fessier: #e84c9d;
      --couleur-tete: #2563eb;
      --couleur-visage: #050505;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      gap: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 13px;
      color: #94a3b8;
    }

    .main-container {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      max-width: 1100px;
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    @media (max-width: 860px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }

    /* Zone d'affichage du coureur */
    .viewport-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #020617;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      min-height: 480px;
    }

    .runner-stage {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .runner-stage svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Piste / sol décoratif */
    .track-line {
      position: absolute;
      bottom: 60px;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.3), transparent);
    }

    /* Barre d'outils / modes */
    .mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .mode-btn {
      flex: 1;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: #94a3b8;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: #3b82f6;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    /* Panneau de personnalisation */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-header {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .colors-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .color-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    .color-item label {
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 500;
    }

    .color-picker-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-picker-wrap input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }

    .color-picker-wrap input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-picker-wrap input[type="color"]::-webkit-color-swatch {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
    }

    .color-value {
      font-family: monospace;
      font-size: 12px;
      color: #94a3b8;
      width: 65px;
    }

    .actions-bar {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-action {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
  </style>
</head>

      <div class="track-line"></div>
    </div>

    <!-- Colonne DROITE : Personnalisation des couleurs -->
    <div class="controls-panel">
      <div class="panel-header">
        <span>🎨 Palette de Couleurs</span>
      </div>

      <div class="colors-list" id="colors-container">
        <!-- Généré dynamiquement en JS -->
      </div>

      <div class="actions-bar">
        <button type="button" class="btn-action btn-primary" onclick="sauvegarderCouleurs()">💾 Enregistrer</button>
        <button type="button" class="btn-action btn-secondary" onclick="reinitialiserCouleurs()">🔄 Réinitialiser</button>
      </div>
    </div>
  </div>

  <script>
    const CONFIG_CATEGORIES = [
      { id: '--couleur-tete', label: 'Tête', defaultColor: '#2563eb' },
      { id: '--couleur-visage', label: 'Yeux / Visage', defaultColor: '#050505' },
      { id: '--couleur-torse', label: 'Torse (T-shirt)', defaultColor: '#000000' },
      { id: '--couleur-bras', label: 'Bras (Biceps)', defaultColor: '#2563eb' },
      { id: '--couleur-mains', label: 'Mains & Poignets', defaultColor: '#2563eb' },
      { id: '--couleur-fessier', label: 'Fessier', defaultColor: '#e84c9d' },
      { id: '--couleur-jambes', label: 'Jambes & Cuisses', defaultColor: '#e84c9d' },
      { id: '--couleur-chaussure', label: 'Chaussures (Base)', defaultColor: '#f4f6fb' },
      { id: '--couleur-chaussure-blanc', label: 'Chaussures (Semelles)', defaultColor: '#ffffff' },
      { id: '--couleur-chaussure-fonce', label: 'Chaussures (Ombres)', defaultColor: '#ffffff' },
    ];

    let couleursActuelles = {};

    function initColors() {
      const container = document.getElementById('colors-container');
      container.innerHTML = '';

      const saved = localStorage.getItem('runnerColors');
      let savedObj = {};
      if (saved) {
        try { savedObj = JSON.parse(saved); } catch (e) {}
      }

      CONFIG_CATEGORIES.forEach(cat => {
        const val = savedObj[cat.id] || cat.defaultColor;
        couleursActuelles[cat.id] = val;
        document.documentElement.style.setProperty(cat.id, val);

        const item = document.createElement('div');
        item.className = 'color-item';
        item.innerHTML = `
          <label for="picker-${cat.id}">${cat.label}</label>
          <div class="color-picker-wrap">
            <input type="color" id="picker-${cat.id}" value="${val}" oninput="updateColor('${cat.id}', this.value)">
            <span class="color-value" id="val-${cat.id}">${val.toUpperCase()}</span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function updateColor(id, value) {
      couleursActuelles[id] = value;
      document.documentElement.style.setProperty(id, value);
      const label = document.getElementById(`val-${id}`);
      if (label) label.textContent = value.toUpperCase();
    }

    function sauvegarderCouleurs() {
      localStorage.setItem('runnerColors', JSON.stringify(couleursActuelles));
      alert('Couleurs du coureur enregistrées dans le stockage local !');
    }

    function reinitialiserCouleurs() {
      localStorage.removeItem('runnerColors');
      initColors();
    }

    function setMode(mode) {
      const stageRun = document.getElementById('stage-run');
      const stageRest = document.getElementById('stage-rest');
      const btnRun = document.getElementById('btn-mode-run');
      const btnRest = document.getElementById('btn-mode-rest');

      if (mode === 'run') {
        stageRun.style.display = 'flex';
        stageRest.style.display = 'none';
        btnRun.classList.add('active');
        btnRest.classList.remove('active');
      } else {
        stageRun.style.display = 'none';
        stageRest.style.display = 'flex';
        btnRun.classList.remove('active');
        btnRest.classList.add('active');
      }
    }

    initColors();
  </script>
</body>
</html>
