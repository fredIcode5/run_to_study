  :root {
    --couleur-chaussure: #f4f6fb;
    --couleur-chaussure-blanc: #ffffff;
    --couleur-chaussure-fonce: #ffffff;
    --couleur-bras: #2563eb;
    --couleur-jambes: #e84c9d;
    --couleur-mains: #2563eb;
    --couleur-torse: #000000;
    --couleur-fessier: #e84c9d;
    --couleur-tete: #2563eb;
    --couleur-visage: #050505;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  #root {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding: 32px;
  }

  .svg-container {
    width: 90vw;
    max-width: 500px;
    aspect-ratio: 1 / 1;
    /* Le fondu se fait uniquement sur l'opacité */
    transition: opacity 0.8s ease-in-out;
  }

  .svg-container.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .svg-container.visible {
    opacity: 1;
  }

  .svg-container svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .boutons {
    display: flex;
    gap: 16px;
  }

  button {
    padding: 12px 26px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  button:active:not(:disabled) {
    transform: translateY(0);
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    box-shadow: none;
  }

  .btn-apparaitre {
    background-color: #2563eb;
    color: #ffffff;
  }

  .btn-disparaitre {
    background-color: #e84c9d;
    color: #ffffff;
  }
</style>
